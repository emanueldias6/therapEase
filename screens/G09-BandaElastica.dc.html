<main style="position: absolute; left: 32px; top: 157px; width: 376px; display: flex; flex-direction: column; gap: 12px">

<div style="border-radius: 14px; background: #e8f8f5; padding: 12px 12px 12px 16px; display: flex; align-items: center; gap: 12px"><span style="flex-grow: 1; font-size: 16px; line-height: 22px; font-weight: 600; color: #11363c">Elevação de braços</span><span style="border-radius: 15px; background: #11363c; padding: 4px 12px; font-size: 14px; line-height: 20px; font-weight: 700; color: #ffffff">nº 6</span></div>

<section aria-labelledby="cui" style="border-radius: 16px; background: #f5fcfb; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 10px">
