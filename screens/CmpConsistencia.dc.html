<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Consistência</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<section aria-labelledby="cons" style="width: 376px; box-sizing: border-box; border-radius: 16px; background: #f5fcfb; padding: 16px 20px 18px; box-shadow: 0 4px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 12px; font-family: 'Nunito', sans-serif; color: #1f5953">
<h3 id="cons" style="margin: 0; font-size: 18px; line-height: 27px; font-weight: 600">Consistência</h3>
<ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{badges}}" as="b" hint-placeholder-count="3">
<li aria-label="{{b.aria}}" style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<span style="position: relative; width: 44px; height: 56px; border-radius: 22px; background: {{b.bg}}; display: flex; align-items: center; justify-content: center">
<svg width="44" height="56" viewBox="0 0 44 56" style="position: absolute; inset: 0; display: {{b.ringShow}}" aria-hidden="true"><path d="M22 1.5A20.5 20.5 0 0 1 42.5 22V34A20.5 20.5 0 0 1 1.5 34V22A20.5 20.5 0 0 1 22 1.5Z" pathLength="100" fill="none" stroke="#c8dfdc" stroke-width="3"></path><path d="M22 1.5A20.5 20.5 0 0 1 42.5 22V34A20.5 20.5 0 0 1 1.5 34V22A20.5 20.5 0 0 1 22 1.5Z" pathLength="100" fill="none" stroke="#1e5c66" stroke-width="3" stroke-linecap="round" stroke-dasharray="{{b.dash}} 100"></path></svg>
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{b.fg}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{b.paths}}" as="p" hint-placeholder-count="3"><path d="{{p}}"></path></sc-for></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; line-height: 18px; font-weight: 700">{{b.t}}</span>
<span style="font-size: 12px; line-height: 16px; font-weight: 500; opacity: {{b.subOp}}">{{b.sub}}</span>
</span>
</li>
</sc-for>
</ul>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":376,"height":190}}'>
// Badges = marcos reais calculados a partir da atividade registada (sequência de dias com sessão, total de sessões feitas).
// Conquistado: círculo teal cheio. Em curso: próximo marco definido pelo sistema, com o progresso real até lá.
class Component extends DCLogic {
renderVals() {
const icons = {
flame: ['M12 12c2 -2.96 0 -7 -1 -8c0 3.038 -1.773 4.741 -3 6c-1.226 1.26 -2 3.24 -2 5a6 6 0 1 0 12 0c0 -1.532 -1.056 -3.94 -2 -5c-1.786 3 -2.791 3 -4 2z'],
check: ['M11.5 21h-5.5a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v6', 'M16 3v4', 'M8 3v4', 'M4 11h16', 'M15 19l2 2l4 -4'],
award: ['M12 9m-6 0a6 6 0 1 0 12 0a6 6 0 1 0 -12 0', 'M12 15l3.4 5.89l1.598 -3.233l3.598 .232l-3.4 -5.889', 'M6.802 12l-3.4 5.89l3.598 -.233l1.598 3.232l3.4 -5.889']
};
const list = [
{ icon: 'flame', t: '3 dias seguidos', sub: 'Sequência atual', done: true },
{ icon: 'check', t: '10 sessões', sub: 'Conquistado', done: true },
{ icon: 'award', t: '7 dias seguidos', sub: 'Faltam 4 dias', done: false, prog: 3 / 7 }
];
return {
badges: list.map(b => ({
paths: icons[b.icon], t: b.t, sub: b.sub,
bg: b.done ? '#1e5c66' : '#f5fcfb', fg: b.done ? '#ffffff' : '#1e5c66',
ringShow: b.done ? 'none' : 'block', dash: Math.round((b.prog || 0) * 100), subOp: b.done ? 0.85 : 1,
aria: b.t + (b.done ? ', conquistado' : ', em curso: ' + b.sub)
}))
};
}
}
</script>
</body>
</html>
