<sc-for list="{{items}}" as="i" hint-placeholder-count="6">
<li><a href="{{i.href}}" style="min-height: 84px; box-sizing: border-box; border-radius: 16px; background: #f5fcfb; padding: 16px 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.06); display: flex; align-items: center; gap: 16px; color: #1f5953">

<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 18px; line-height: 25px; font-weight: 700">{{i.t}}</span><span style="font-size: 14px; line-height: 20px">{{i.d}}</span></span>
<sc-if value="{{i.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="flex-shrink: 0; white-space: nowrap; height: 26px; padding: 0 10px; border-radius: 13px; background: #d92d20; color: #ffffff; font-size: 13px; font-weight: 700; display: flex; align-items: center">{{i.badge}}</span></sc-if>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f5953" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6l-6 6"></path></svg>

</sc-for>
</ul>
</nav>
<div style="position: absolute; left: 0; top: 847px"><dc-import name="CmpBottomBar" hint-size="440px,75px"></dc-import></div>
<div style="position: absolute; left: 144px; bottom: 8px; width: 152px; height: 5px; border-radius: 100px; background: #000000"></div>
