<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Cartão de artigo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<a href="{{href}}" aria-label="{{aria}}" style="width: 376px; box-sizing: border-box; border-radius: 16px; background: #f5fcfb; box-shadow: 0 4px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; overflow: hidden; font-family: 'Nunito', sans-serif; color: #1f5953; text-decoration: none">
<div style="position: relative; height: 150px; background: {{tint}}; overflow: hidden">
<sc-if value="{{hasImg}}" hint-placeholder-val="{{ true }}"><img src="{{img}}" alt="" style="display: block; width: 376px; height: 150px; object-fit: {{fit}}; object-position: {{pos}}"></sc-if>
<sc-if value="{{noImg}}" hint-placeholder-val="{{ false }}"><div aria-hidden="true" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="{{ink}}" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><sc-for list="{{icon}}" as="p" hint-placeholder-count="2"><path d="{{p}}"></path></sc-for></svg></div></sc-if>
<sc-if value="{{hasBadge}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; left: 12px; top: 12px; height: 30px; padding: 0 12px; box-sizing: border-box; border-radius: 10px; background: {{badgeBg}}; color: {{badgeC}}; display: flex; align-items: center; font-size: 16px; font-weight: 600">{{badge}}</span></sc-if>
<sc-if value="{{hasState}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 12px; top: 13px; height: 28px; padding: 0 10px; box-sizing: border-box; border-radius: 14px; background: {{stBg}}; color: {{stC}}; display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{stC}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{stIcon}}" as="p" hint-placeholder-count="1"><path d="{{p}}"></path></sc-for></svg>{{stLabel}}</span></sc-if>
<sc-if value="{{hasBar}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: #f5fcfb"><span style="display: block; width: {{pct}}%; height: 5px; background: #1e5c66"></span></span></sc-if>
</div>
<div style="padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 6px">
<sc-if value="{{hasCtx}}" hint-placeholder-val="{{ true }}"><span style="font-size: 14px; line-height: 20px; color: #6b5a88">{{ctx}}</span></sc-if>
<div style="display: flex; align-items: flex-start; gap: 12px">
<span style="flex-grow: 1; font-size: 20px; line-height: 28px; font-weight: 600">{{t}}</span>
<svg width="24" height="24" viewBox="0 0 24 24" fill="{{bmFill}}" stroke="#1e5c66" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M18 7v14l-6 -4l-6 4v-14a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4z"></path></svg>
</div>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 3px">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="5"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="{{s.id}}"><stop offset="{{s.f}}" stop-color="#e38b4a"></stop><stop offset="{{s.f}}" stop-color="#e38b4a" stop-opacity="0"></stop></linearGradient></defs><path d="M12 17.75l-6.172 3.245l1.179 -6.873l-5 -4.867l6.9 -1l3.086 -6.253l3.086 6.253l6.9 1l-5 4.867l1.179 6.873z" fill="url(#{{s.id}})" stroke="#e38b4a" stroke-width="1.6" stroke-linejoin="round"></path></svg></sc-for>
<span style="margin-left: 4px; font-size: 14px; line-height: 20px">{{ratingTxt}}</span>
</div>
<span style="font-size: 14px; line-height: 20px">{{desc}}</span>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 20px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f5953" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0 -18"></path><path d="M12 7v5l3 3"></path></svg>{{meta}}</span>
<span style="flex: none; height: 31px; padding: 0 20px; box-sizing: border-box; border-radius: 8px; background: #f6f9f9; box-shadow: inset 0 0 0 1px #1e5c66; color: #1e5c66; display: flex; align-items: center; font-size: 16px; font-weight: 500">{{cta}}</span>
</div>
</div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"t":{"editor":"text","default":"Preparar o espaço em casa"},"desc":{"editor":"text","default":"Como escolher e arrumar o sítio onde vai fazer os exercícios."},"ctx":{"editor":"text","default":"Prescrito a 24 set"},"img":{"editor":"text","default":""},"pos":{"editor":"text","default":"50% 30%"},"tint":{"editor":"text","default":"#f3f0f8"},"ink":{"editor":"text","default":"#6b5a88"},"icon":{"editor":"enum","options":["livro","casa","respirar","dor","cadeira","telemovel","plano"],"default":"livro"},"badge":{"editor":"enum","options":["","novo","prescrito","atualizado"],"default":""},"rating":{"editor":"text","default":"4.6"},"min":{"editor":"int","default":4},"state":{"editor":"enum","options":["","emLeitura","lido"],"default":""},"pct":{"editor":"int","default":0},"saved":{"editor":"enum","options":["false","true"],"default":"false"},"href":{"editor":"text","default":""},"$preview":{"width":376,"height":360}}'>
// Cartão de artigo (Figma "Cartão de artigo"): Por ler → Ver mais (página do artigo, H15); Em leitura → barra + etiqueta + Continuar (vai direto à leitura, H02);
// Lido → barra completa + etiqueta "Lido" + Ver mais. Linha de contexto (data da prescrição ou tema) e tempo previsto de leitura.
let uid = 0;
class Component extends DCLogic {
renderVals() {
const p = this.props;
const ICONS = {
livro: ['M3 19a9 9 0 0 1 9 0a9 9 0 0 1 9 0', 'M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0', 'M3 6l0 13', 'M12 6l0 13', 'M21 6l0 13'],
casa: ['M5 12l-2 0l9 -9l9 9l-2 0', 'M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7', 'M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6'],
respirar: ['M5 8h8.5a2.5 2.5 0 1 0 -2.34 -3.24', 'M3 12h15.5a2.5 2.5 0 1 1 -2.34 3.24', 'M4 16h5.5a2.5 2.5 0 1 1 -2.34 3.24'],
dor: ['M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0 -18', 'M9 10h.01', 'M15 10h.01', 'M9.5 16a3.5 3.5 0 0 1 5 0'],
cadeira: ['M5 11a2 2 0 0 1 2 2v2h10v-2a2 2 0 1 1 4 0v4a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-4a2 2 0 0 1 2 -2z', 'M5 11v-5a3 3 0 0 1 3 -3h8a3 3 0 0 1 3 3v5', 'M6 19v2', 'M18 19v2'],
telemovel: ['M6 5a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-14z', 'M11 4h2', 'M12 17v.01'],
plano: ['M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2', 'M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z', 'M9 14l2 2l4 -4']
};
const r = parseFloat(p.rating ?? '4.6') || 0;
const id = 'st' + (++uid);
const stars = [0, 1, 2, 3, 4].map(i => ({ id: id + i, f: Math.max(0, Math.min(1, r - i)).toFixed(2) }));
const B = { novo: ['Novo', '#fbe0d3', '#8c4530'], prescrito: ['Prescrito', '#f3f0f8', '#6b5a88'], atualizado: ['Atualizado', '#fbe0d3', '#8c4530'] }[p.badge || ''];
const state = p.state === 'naoLido' ? '' : (p.state || '');
const min = +(p.min ?? 4);
const pct = state === 'lido' ? 100 : +(p.pct ?? 0);
const S = { emLeitura: ['Em leitura', '#fef3ec', '#8c5228', ['M3 19a9 9 0 0 1 9 0a9 9 0 0 1 9 0', 'M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0', 'M3 6l0 13', 'M12 6l0 13', 'M21 6l0 13']], lido: ['Lido', '#e3f5e6', '#0e5841', ['M5 12l5 5l10 -10']] }[state];
const left = Math.max(1, Math.ceil(min * (1 - pct / 100)));
const meta = state === 'emLeitura' ? 'Faltam ' + left + ' min' : min + ' min de leitura';
const cta = state === 'emLeitura' ? 'Continuar' : 'Ver mais';
const href = p.href || (state === 'emLeitura' ? 'H02-Artigo.dc.html' : 'H15-SobreArtigo.dc.html');
return {
t: p.t, desc: p.desc, ctx: p.ctx || '', hasCtx: !!p.ctx, href, img: p.img || '', pos: p.pos || '50% 30%', fit: /\.png$/.test(p.img || '') ? 'contain' : 'cover', hasImg: !!p.img, noImg: !p.img,
tint: p.tint || '#f3f0f8', ink: p.ink || '#6b5a88', icon: ICONS[p.icon] || ICONS.livro,
hasBadge: !!B, badge: B ? B[0] : '', badgeBg: B ? B[1] : '#fbe0d3', badgeC: B ? B[2] : '#8c4530',
hasState: !!S, stLabel: S ? S[0] : '', stBg: S ? S[1] : '#e3f5e6', stC: S ? S[2] : '#0e5841', stIcon: S ? S[3] : ['M5 12l5 5l10 -10'],
hasBar: pct > 0, pct,
stars, ratingTxt: r.toFixed(1).replace('.', ','),
meta, cta, bmFill: p.saved === 'true' ? '#1e5c66' : 'none',
aria: p.t + '. ' + (B ? B[0] + '. ' : '') + (S ? S[0] + '. ' : '') + 'Classificação ' + r.toFixed(1).replace('.', ',') + ' em 5. ' + meta + '. ' + cta + '.'
};
}
}
</script>
</body>
</html>
