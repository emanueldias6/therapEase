<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>PIN preenchido</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Nunito',sans-serif;color:#1e5c66}a{color:#1e5c66;text-decoration:none}a:hover{color:#11363c}a[href],button,[role=button],[role=radio]{transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .16s,filter .16s}a[href]:not([aria-label*="(avança"]):active,button:active,[role=button]:active,[role=radio]:active{transform:translateY(2px) scale(.97);filter:brightness(.94);box-shadow:inset 0 2px 4px rgba(17,54,60,.2)!important;transition-duration:.08s;transition-timing-function:ease-out}</style>
</helmet>
<div style="position: relative; width: 440px; height: 956px; overflow: hidden; background: linear-gradient(160deg, #fafefd 0%, #d5e5e2 52%, #8eaeb2 100%); font-family: 'Nunito', sans-serif; color: #1e5c66">
<dc-import name="CmpStatusBar" tone="light" hint-size="440px,53px"></dc-import>
<h1 style="position: absolute; left: 32px; top: 252px; width: 376px; margin: 0; text-align: center; font-size: 32px; line-height: 40px; font-weight: 500">{{title}}</h1>
<div aria-label="{{filledLabel}}" style="position: absolute; left: 102px; top: 327px; width: 236px; height: 26px; display: flex; justify-content: space-between">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="6"><span style="width: 26px; height: 26px; border-radius: 13px; background: {{d.bg}}"></span></sc-for>
</div>
<div style="position: absolute; left: 87px; top: 393px; width: 266px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 14px; column-gap: 27px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<a href="{{k.next}}" aria-label="{{k.label}}" style="width: 70px; height: 70px; border-radius: 35px; background: {{k.bg}}; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); box-shadow: {{k.sh}}; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 400; color: #1e5c66">
<sc-if value="{{k.isDigit}}" hint-placeholder-val="{{ true }}">{{k.label}}</sc-if>
<sc-if value="{{k.isFinger}}" hint-placeholder-val="{{ false }}"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#1e5c66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.9 7a8 8 0 0 1 1.1 5v1a6 6 0 0 0 .8 3"></path><path d="M8 11a4 4 0 0 1 8 0v1a10 10 0 0 0 2 6"></path><path d="M12 11v2a14 14 0 0 0 2.5 8"></path><path d="M8 15a18 18 0 0 0 1.8 6"></path><path d="M4.9 19a22 22 0 0 1 -.9 -7v-1a8 8 0 0 1 12 -6.95"></path></svg></sc-if>
<sc-if value="{{k.isBack}}" hint-placeholder-val="{{ false }}"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#1e5c66" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-11l-5 -5a1.5 1.5 0 0 1 0 -2l5 -5z"></path><path d="M12 10l4 4m0 -4l-4 4"></path></svg></sc-if>
</a>
</sc-for>
</div>
<div style="position: absolute; left: 144px; bottom: 8px; width: 152px; height: 5px; border-radius: 100px; background: #000000"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":956}}'>
class Component extends DCLogic {
renderVals() {
const filled = 6;
const next = 'A11-PinRepetir.dc.html';
const labels = ['1','2','3','4','5','6','7','8','9','Impressão digital','0','Apagar'];
return {
title: 'Defina novo PIN',
next,
filledLabel: filled + ' de 6 dígitos introduzidos',
dots: [0,1,2,3,4,5].map(i => ({ bg: i < filled ? '#1e5c66' : '#c8dfdc' })),
keys: labels.map(l => ({ next: next, label: l, isDigit: l.length === 1, isFinger: l === 'Impressão digital', isBack: l === 'Apagar', bg: l.length === 1 ? 'rgba(17,54,60,0.10)' : '#ffffff', sh: l.length === 1 ? 'inset 1px 1px 1px rgba(255,255,255,0.75), inset -1px -1px 2px rgba(17,54,60,0.12)' : '0 4px 12px rgba(17,54,60,0.10)' }))
};
}
}
</script>
</body>
</html>
