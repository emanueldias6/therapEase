<!doctype html>

<body>

</svg>

<script type="text/x-dc" data-dc-script data-props='{"states":{"editor":"text","default":"cppp"},"countdown":{"editor":"int","default":10,"min":0,"max":10},"big":{"editor":"text","default":""},"small":{"editor":"text","default":""},"$preview":{"width":334,"height":334}}'>
// Asset fornecido: assets/circulo-series-countdown.svg. A geometria de todas as partes vem do asset, sem alterações.
// Cores do asset (verde/laranja) são só referência estrutural; os estados da interface são branco + opacidade.
// Circunferência exterior = TEMPO (countdown): sempre branca; base a 20%, a parte já decorrida a 90%. Nunca representa qualidade.
// Quatro segmentos interiores = SÉRIES:
//   p = inativa (branco 20%, estável), a = série disponível (branco 90%, estável — ecrã "4 Séries"), c = série que vai começar (branco 90%, a ÚNICA que pisca), w = série em execução (branco 90%),
//   x = à espera do resultado (branco 20%), g / y / r = série concluída = média da qualidade das repetições (verde / amarelo / vermelho),
//   G / Y / R = o resultado está a ser preenchido pelas repetições (animação única).
// Número central: o "5" é o glifo do asset; os restantes dígitos usam a mesma fonte, tamanho e linha de base.
const SEGS = ['M191.397 31C220.074 36.0427 246.414 50.0096 266.642 70.8991C286.87 91.7885 299.947 118.528 304 147.285C293.299 148.785 283.563 141.249 280.307 130.946C274.823 113.598 265.363 97.661 252.571 84.4502C239.755 71.2155 224.081 61.2189 206.851 55.1515C196.691 51.5737 189.521 41.6071 191.397 31Z', 'M303 191.397C297.957 220.074 283.99 246.414 263.101 266.642C242.211 286.87 215.472 299.947 186.715 304C185.215 293.3 192.751 283.563 203.054 280.307C220.402 274.823 236.339 265.363 249.55 252.571C262.784 239.755 272.781 224.081 278.848 206.851C282.426 196.691 292.393 189.521 303 191.397Z', 'M142.603 303C113.926 297.957 87.5862 283.99 67.3581 263.101C47.1301 242.211 34.0526 215.472 30 186.715C40.7005 185.215 50.4366 192.751 53.6932 203.054C59.1766 220.402 68.6366 236.339 81.4292 249.55C94.2448 262.784 109.919 272.781 127.149 278.848C137.309 282.426 144.479 292.393 142.603 303Z', 'M31 142.603C36.0427 113.926 50.0096 87.5862 70.8991 67.3581C91.7885 47.1301 118.528 34.0526 147.285 30C148.785 40.7005 141.249 50.4366 130.946 53.6932C113.598 59.1766 97.661 68.6366 84.4502 81.4292C71.2155 94.2448 61.2189 109.919 55.1515 127.149C51.5737 137.309 41.6071 144.479 31 142.603Z'];
class Component extends DCLogic {
constructor(props) { super(props); this.uid = 'cw' + Math.random().toString(36).slice(2, 8); this.state = {}; }
componentDidMount() {
// Contagem sem voltar a desenhar o componente (assim o fade da série não reinicia):
// número 10 → 1, circunferência exterior a encher de forma contínua ao longo dos 10 s, tudo no mesmo relógio.
const n = parseInt(this.props.countdown ?? 10, 10) || 0;
if (n <= 0) return;
const host = this.__inst && this.__inst.host; if (!host) return;
const ring = host.querySelector('.wheel-ring'), five = host.querySelector('.wheel-five'), dig = host.querySelector('.wheel-digit');
const t0 = performance.now();
const step = () => {
const el = (performance.now() - t0) / 1000;
const v = Math.max(1, n - Math.floor(el));
if (ring) ring.setAttribute('stroke-dashoffset', (100 * (1 - Math.min(1, el / n))).toFixed(2));
if (five) five.style.display = v === 5 ? '' : 'none';
if (dig) { dig.style.display = v === 5 ? 'none' : ''; if (dig.textContent !== String(v)) dig.textContent = String(v); }
const lab = host.firstElementChild; if (lab) lab.setAttribute('aria-label', 'Série a iniciar em ' + v + ' segundos');
if (el < n + 1) this.raf = requestAnimationFrame(step);
};
this.raf = requestAnimationFrame(step);
}
componentWillUnmount() { if (this.raf) cancelAnimationFrame(this.raf); }
renderVals() {
const states = (this.props.states ?? 'cppp').padEnd(4, 'p').split('').slice(0, 4);
const cd = parseInt(this.props.countdown ?? 10, 10) || 0;
const col = { p: '#ffffff', a: '#ffffff', c: '#ffffff', w: '#ffffff', x: '#ffffff', g: '#00E156', y: '#FFE204', r: '#FF3B30' };
const opa = { p: 0.2, x: 0.2, a: 0.9, c: 0.9, w: 0.9, g: 1, y: 1, r: 1 };
const pt = (deg, r) => { const a = deg * Math.PI / 180; return (167 + r * Math.sin(a)).toFixed(1) + ' ' + (167 - r * Math.cos(a)).toFixed(1); };
const segs = states.map((s, i) => {
const k = s.toLowerCase(), up = s !== k;
const a0 = i * 90 + 2, a1 = i * 90 + 88;
return {
d: SEGS[i], mid: this.uid + '-s' + i,
fill: up ? '#ffffff' : col[k] || col.p, op: up ? 0.2 : (opa[k] ?? 0.2),
blink: s === 'c' ? 'wheelBlink 1s ease-in-out infinite' : 'none', // fade in / fade out, 1 ciclo por segundo (sincronizado com o número)
reveal: up, revealFill: col[k] || '#ffffff', revealAnim: up ? 'wheelReveal 0.9s ease-out 1.1s both' : 'none',
arc: 'M' + pt(a0, 128.5) + ' A128.5 128.5 0 0 1 ' + pt(a1, 128.5)
};
});
const value = cd; // valor inicial (10); a descida 10 → 1 é feita no componentDidMount
const big = this.props.big ?? '', small = this.props.small ?? '';
const next = states.findIndex(s => s === 'c');
return {
segs, ringMask: this.uid + '-ring', showRing: cd > 0, ringAnim: 'wheelRing ' + (cd || 10) + 's linear both', // a circunferência exterior enche uma vez ao longo dos 10 s
fiveDisp: value === 5 ? 'inline' : 'none', digitDisp: value === 5 ? 'none' : 'inline', digit: String(value),
hasLabel: cd === 0 && !!big, big, small,
aria: cd > 0 ? 'Série ' + (next + 1) + ' de 4 a iniciar em ' + value + ' segundos' : (big ? big + ' ' + small : 'Séries')
};
}
}
</script>
