<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Dashboard a carregar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Nunito',sans-serif;color:#1e5c66}a{color:#1e5c66;text-decoration:none}a:hover{color:#11363c}a[href],button,[role=button],[role=radio]{transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .16s,filter .16s}a[href]:not([aria-label*="(avança"]):active,button:active,[role=button]:active,[role=radio]:active{transform:translateY(2px) scale(.97);filter:brightness(.94);box-shadow:inset 0 2px 4px rgba(17,54,60,.2)!important;transition-duration:.08s;transition-timing-function:ease-out}</style>
</helmet>
<div aria-busy="true" style="position: relative; width: 440px; height: 956px; overflow: hidden; background: linear-gradient(160deg, #fafefd 0%, #d5e5e2 52%, #8eaeb2 100%); font-family: 'Nunito', sans-serif; color: #1f5953">
<dc-import name="CmpStatusBar" tone="light" hint-size="440px,53px"></dc-import>
<p style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">A carregar o seu dia…</p>
<main aria-hidden="true" style="position: absolute; left: 32px; top: 73px; width: 376px; display: flex; flex-direction: column; gap: 12px">
<div style="height: 169px; box-sizing: border-box; border-radius: 16px; background: #fbe0d3; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<span style="width: 190px; height: 26px; border-radius: 8px; background: #f8c3ad"></span>
<span style="width: 100px; height: 14px; border-radius: 7px; background: #f8c3ad"></span>
<span style="margin-top: 8px; width: 170px; height: 20px; border-radius: 8px; background: #f8c3ad"></span>
<span style="width: 220px; height: 14px; border-radius: 7px; background: #f8c3ad"></span>
</div>
<div style="height: 84px; border-radius: 16px; background: #f5fcfb; display: flex; align-items: center; gap: 14px; padding: 0 20px">
<span style="width: 52px; height: 52px; border-radius: 12px; background: #dfedf0"></span>
<span style="display: flex; flex-direction: column; gap: 8px"><span style="width: 120px; height: 12px; border-radius: 6px; background: #d8eee9"></span><span style="width: 200px; height: 16px; border-radius: 8px; background: #d8eee9"></span></span>
</div>
<div style="margin-top: -4px; display: flex; gap: 16px">
<div style="width: 180px; height: 167px; border-radius: 16px; background: #f5fcfb"></div>
<div style="width: 180px; height: 167px; border-radius: 16px; background: #f5fcfb"></div>
</div>
<div style="margin-top: -4px; height: 121px; border-radius: 16px; background: #f5fcfb; display: flex; align-items: center; justify-content: space-between; padding: 0 20px">
<sc-for list="{{seven}}" as="d" hint-placeholder-count="7"><span style="width: 36px; height: 36px; border-radius: 18px; background: #dfedf0"></span></sc-for>
</div>
<div style="height: 175px; border-radius: 16px; background: #f5fcfb"></div>
</main>
<div style="position: absolute; left: 0; top: 847px"><dc-import name="CmpBottomBar" dot="{{no}}" hint-size="440px,75px"></dc-import></div>
<div style="position: absolute; left: 144px; bottom: 8px; width: 152px; height: 5px; border-radius: 100px; background: #000000"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":956}}'>
class Component extends DCLogic {
renderVals() { return { no: false, seven: [1, 2, 3, 4, 5, 6, 7] }; }
}
</script>
</body>
</html>
