// Roda da sessão autónoma (Figma CmpAutonomousWheel): o anel exterior mostra o tempo decorrido (como no HUD dos exercícios),
// o arco interior é o medidor de 60 a 180 bpm com a faixa da zona alvo e o marcador da frequência cardíaca.
// estado "zona" = dentro da zona (#4fd1e0); "acima" = acima da zona (#ff8a1f).
class Component extends DCLogic {
renderVals() {
const acima = (this.props.estado ?? 'zona') === 'acima';
const fc = String(this.props.fc ?? (acima ? 128 : 108)), tempo = this.props.tempo ?? '08:30';
return acima
? { cor: '#ff8a1f', zonaOp: 0.5, mx: 222.19, my: 40.24, mr: 113.48, fc, tempo, aria: `Frequência cardíaca ${fc} bpm, acima da zona alvo. Tempo ${tempo}.` }
: { cor: '#4fd1e0', zonaOp: 1, mx: 121.09, my: 35.33, mr: 67.31, fc, tempo, aria: `Frequência cardíaca ${fc} bpm, na zona alvo. Tempo ${tempo}.` };
}
}
