<script type="text/x-dc" data-dc-script data-props='{"zones":{"editor":"text","default":"wwwwwwwwwwww"},"raiseL":{"editor":"int","default":0,"min":0,"max":180},"raiseR":{"editor":"int","default":0,"min":0,"max":180},"demo":{"editor":"boolean","default":false},"$preview":{"width":440,"height":400}}'>
// Skeleton frontal = asset SVG fornecido (assets/skeleton-frontal.svg), 12 zonas com a geometria original.
// O acompanhamento do corpo faz-se só com transformações rígidas (os braços rodam no ombro); as formas não mudam.
// zones: uma letra por zona, pela ordem do asset: braço dir. (3), peito, bacia, coxa esq., perna esq., coxa dir., perna dir., braço esq. (3).
// w = base (branco 20%), g = objetivo atingido (verde 90%), o = a corrigir (laranja 90%, com sinal sonoro e voz).
class Component extends DCLogic {
renderVals() {
const Z = (this.props.zones ?? 'wwwwwwwwwwww').padEnd(12, 'w').split('');
const demo = this.props.demo === true || this.props.demo === 'true';
const pal = { w: ['#ffffff', demo ? 0.9 : 0.2], g: ['#00E156', 0.9], o: ['#FF8A1F', 0.9] };
const z = Z.map(k => ({ c: (pal[k] || pal.w)[0], o: (pal[k] || pal.w)[1] }));
const out = { rotL: +(this.props.raiseL ?? 0), rotR: -(this.props.raiseR ?? 0),
// demo = pré-visualização animada do movimento (elevação de braços), com o mesmo asset
animR: demo ? 'transform-origin: 136.25px 15px; animation: skArmR 3s ease-in-out infinite' : '', animL: demo ? 'transform-origin: 13.25px 19px; animation: skArmL 3s ease-in-out infinite' : '' };
z.forEach((v, i) => { out['z' + i + 'c'] = v.c; out['z' + i + 'o'] = v.o; });
const n = (k) => Z.filter(x => x === k).length;
out.aria = 'Skeleton: ' + n('g') + ' zonas com objetivo atingido, ' + n('o') + ' zonas a corrigir';
return out;
}
}
</script>
