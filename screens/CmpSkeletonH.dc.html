// Mesmo asset do skeleton frontal (assets/skeleton-frontal.svg), sem alterar a forma de nenhuma zona:
// cada zona é só deslocada e rodada para acompanhar o corpo em quatro apoios (braço esq. do asset = braço esticado,

class Component extends DCLogic {
renderVals() {
const Z = (this.props.zones ?? 'wwwwwwwwwwww').padEnd(12, 'w').split('');

const z = Z.map(k => ({ c: (pal[k] || pal.w)[0], o: (pal[k] || pal.w)[1] }));
const out = {};
z.forEach((v, i) => { out['z' + i + 'c'] = v.c; out['z' + i + 'o'] = v.o; });
const n = (k) => Z.filter(x => x === k).length;
out.aria = 'Skeleton: ' + n('g') + ' zonas com objetivo atingido, ' + n('o') + ' zonas a corrigir';
return out;
}
}
