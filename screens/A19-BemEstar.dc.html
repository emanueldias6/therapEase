<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Resposta de bem-estar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Nunito',sans-serif;color:#1e5c66}a{color:#1e5c66;text-decoration:none}a:hover{color:#11363c}button{font-family:'Nunito',sans-serif;cursor:pointer}a[href],button,[role=button],[role=radio]{transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .16s,filter .16s}a[href]:not([aria-label*="(avança"]):active,button:active,[role=button]:active,[role=radio]:active{transform:translateY(2px) scale(.97);filter:brightness(.94);box-shadow:inset 0 2px 4px rgba(17,54,60,.2)!important;transition-duration:.08s;transition-timing-function:ease-out}</style>
</helmet>
<div style="position: relative; width: 440px; height: 956px; overflow: hidden; background: linear-gradient(160deg, #fafefd 0%, #d5e5e2 52%, #8eaeb2 100%); font-family: 'Nunito', sans-serif; color: #1e5c66">
<dc-import name="CmpStatusBar" tone="light" hint-size="440px,53px"></dc-import>
<h1 style="position: absolute; left: 32px; top: 130px; width: 376px; margin: 0; text-align: center; font-size: 36px; line-height: 44px; font-weight: 600; white-space: nowrap">Como se sente hoje ?</h1>
<p style="position: absolute; left: 32px; top: 222px; width: 376px; margin: 0; text-align: center; font-size: 18px; line-height: 24px; font-weight: 500">A sessão de hoje tem isto em conta.</p>
<div role="radiogroup" aria-label="Como se sente hoje" style="position: absolute; left: 32px; top: 290px; width: 376px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{options}}" as="o" hint-placeholder-count="5">
<button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="display: flex; align-items: center; justify-content: space-between; width: 376px; height: 64px; box-sizing: border-box; padding: 0 20px; border: 0; border-radius: 12px; background: {{o.bg}}; color: {{o.fg}}; font-size: 22px; font-weight: 500; box-shadow: {{o.shadow}}">
<span>{{o.label}}</span>
<span aria-hidden="true" style="display: flex"><sc-if value="{{o.f0}}" hint-placeholder-val="{{ false }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="{{o.fc}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01"/><path d="M8.5 16.5a4.5 4.5 0 0 1 7 0"/><path d="M7.5 8.5l2 1M16.5 8.5l-2 1"/></svg></sc-if><sc-if value="{{o.f1}}" hint-placeholder-val="{{ false }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="{{o.fc}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01"/><path d="M9.5 15.5a3.5 3.5 0 0 1 5 0"/></svg></sc-if><sc-if value="{{o.f2}}" hint-placeholder-val="{{ false }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="{{o.fc}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01"/><path d="M9 15h6"/></svg></sc-if><sc-if value="{{o.f3}}" hint-placeholder-val="{{ false }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="{{o.fc}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01"/><path d="M9.5 14.5a3.5 3.5 0 0 0 5 0"/></svg></sc-if><sc-if value="{{o.f4}}" hint-placeholder-val="{{ false }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="{{o.fc}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01"/><path d="M8 13.5h8a4 4 0 0 1 -8 0z"/></svg></sc-if></span>
</button>
</sc-for>
</div>
<a href="B02-DashCalibracao.dc.html" style="position: absolute; left: 32px; top: 738px; display: flex; align-items: center; justify-content: center; width: 376px; height: 50px; border-radius: 12px; background: #1e5c66; color: #ffffff; font-size: 24px; font-weight: 500; box-shadow: 0 0 12px rgba(0,0,0,0.1)">Continuar</a>
<a href="A18-ComoSeSente.dc.html" style="position: absolute; left: 32px; top: 800px; display: flex; align-items: center; justify-content: center; width: 376px; height: 50px; border-radius: 12px; background: #f5fcfb; color: #1e5c66; font-size: 24px; font-weight: 500; box-shadow: 0 0 12px rgba(0,0,0,0.1)">Voltar</a>
<div style="position: absolute; left: 144px; bottom: 8px; width: 152px; height: 5px; border-radius: 100px; background: #000000"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":956}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { picked: 3 }; }
renderVals() {
const labels = ['Muito mal', 'Mal', 'Razoável', 'Bem', 'Muito bem'];
const picked = this.state.picked;
return {
options: labels.map((label, i) => {
const on = i === picked;
return {
label,
checked: on ? 'true' : 'false',
bg: on ? '#1e5c66' : '#f5fcfb',
fg: on ? '#ffffff' : '#1e5c66',
shadow: 'none',
fc: on ? '#ffffff' : ['#e96273','#ff9900','#e7c200','#96bc2b','#5cdc9d'][i],
f0: i === 0, f1: i === 1, f2: i === 2, f3: i === 3, f4: i === 4,
pick: () => this.setState({ picked: i })
};
})
};
}
}
</script>
</body>
</html>
