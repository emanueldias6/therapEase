<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Toast</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div role="status" style="width: {{w}}px; height: 46px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{border}}; background: {{bg}}; color: {{fg}}; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; font-family: 'Nunito', sans-serif; font-size: 16px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{border}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{icon}}"></path></svg>
<span>{{text}}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["success","error","warning","neutral"],"default":"success"},"text":{"editor":"text","default":"Sessão registada"},"w":{"editor":"int","default":320},"$preview":{"width":320,"height":46}}'>
class Component extends DCLogic {
renderVals() {
const k = this.props.kind ?? 'success';
const map = {
success: { bg: '#e3f5e6', border: '#0e5841', fg: '#11363c', icon: 'M5 12l5 5l10 -10' },
error: { bg: '#ffebeb', border: '#d10000', fg: '#11363c', icon: 'M12 9v4M12 17h.01M12 3l9.5 17h-19z' },
warning: { bg: '#fef3ec', border: '#b36b00', fg: '#11363c', icon: 'M12 8v4M12 16h.01M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0 -18' },
neutral: { bg: '#eef1ff', border: '#0048ff', fg: '#141f4f', icon: 'M12 8h.01M11 12h1v4h1M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0 -18' }
};
return { ...map[k], text: this.props.text ?? 'Sessão registada', w: this.props.w ?? 320 };
}
}
</script>
</body>
</html>
